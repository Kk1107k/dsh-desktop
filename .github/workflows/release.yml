# M11：发布流水线（SPEC §11）。v* tag 触发；顺序固定：
#   校验 tag == 包版本 → 检测签名证书（缺则降级为未签名构建并留痕）→ 构建 → 上传 GitHub Releases
#   （签名状态写进 Release 说明）→ tools/release.mjs 同步 COS。
# electron-builder.yml 配置了 github + generic 双 publish 源，构建统一用 --publish never，
# 由本工作流用 gh CLI 受控上传（否则 electron-builder 会对占位 COS 域名发起上传而失败）。
# stable.yml 从构建元数据（latest.yml）复制生成，引用相同已签名产物，禁止虚构哈希。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release 并上传产物需要

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 等于包版本
        shell: pwsh
        run: |
          $pkgVersion = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          if ("v$pkgVersion" -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} 与 package.json 版本 v$pkgVersion 不一致"
            exit 1
          }

      - name: 检测签名证书（缺失则降级为未签名构建）
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          # 签名可降级，但**必须留痕**：缺证书不再是硬门槛，也绝不允许静默跳过 ——
          # 否则将来分不清哪一版签了、哪一版没签。签名状态会写进 Release 说明。
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Write-Warning "未配置 CSC_LINK：本次为【未签名构建】，Release 说明会注明 SmartScreen 提示。"
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "已配置 CSC_LINK：本次为【已签名构建】。"
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 安装依赖（锁文件固定）
        run: pnpm install --frozen-lockfile

      - name: 打包 preload 桥（build/preload.cjs）
        run: pnpm build:preload

      - name: 类型检查
        run: pnpm typecheck

      - name: 验收测试
        run: pnpm test

      - name: 构建 NSIS 安装包（签名）
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder 打包期要下载的两类归档：它自己的构建二进制（winCodeSign/NSIS/7zip）
          # 与 Electron 的归档+校验和。注意：.npmrc 里的 electron_mirror /
          # electron_builder_binaries_mirror 它都不读，只认环境变量，且两个都必须给。
          # 留空 = 官方源（GitHub）；国内 runner 设为：
          #   ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
          #   ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: ""
          ELECTRON_BUILDER_BINARIES_MIRROR: ""

      - name: 从构建元数据生成 stable.yml
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) {
            Write-Error "dist/latest.yml 缺失，构建元数据不完整"
            exit 1
          }
          Copy-Item dist/latest.yml dist/stable.yml

      - name: 上传安装包 / blockmap / latest.yml / stable.yml 到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            (Get-Item "dist/DSH-Desktop-Setup-*.exe").FullName
            (Get-Item "dist/DSH-Desktop-Setup-*.exe.blockmap").FullName
            "dist/latest.yml"
            "dist/stable.yml"
          )
          if (gh release view $tag) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag --title "DSH Desktop $tag" --generate-notes @files
          }

          # 签名状态写进 Release 说明：签了与没签都必须留痕（缺证书已不是硬门槛，但绝不能无声跳过）。
          $signed = ("${{ steps.signing.outputs.signed }}" -eq "true")
          if ($signed) {
            $banner = "> 本版为**已签名构建**。"
          } else {
            $banner = "> ⚠ 本版为**未签名构建**：首次运行可能触发 Windows SmartScreen 提示（选「更多信息 → 仍要运行」）。"
          }
          $body = (gh release view $tag --json body -q .body)
          if ($body -notlike "*已签名构建*" -and $body -notlike "*未签名构建*") {
            # 写到 dist/（已被 .gitignore 忽略）而不是仓库根：否则 git status --porcelain 非空，
            # 会让随后 tools/release.mjs 的 dshBuildDirty 误报 true（元数据说"从脏工作区构建"）。
            ($banner + "`n`n" + $body) | Out-File -FilePath dist/notes.md -Encoding utf8
            gh release edit $tag --notes-file dist/notes.md
          } else {
            Write-Host "Release 说明已含签名状态，跳过。"
          }

      - name: 同步 COS（上传版本化二进制 → 回读校验 → 最后更新 cn-stable.yml）
        run: node tools/release.mjs
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
