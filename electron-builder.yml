appId: com.dshdesktop.app
productName: DSH Desktop
directories:
  output: dist
asar: true
compression: maximum
# ⚠ 产物名**不得含空格**：electron-builder 写 latest.yml 时做 URL 安全规范化（空格→连字符），
# 而 release.mjs 按元数据里的名字去 dist/ 找文件 ⇒ 带空格会让"同步 COS"这一步在 CI 上失败。
# 这里硬编码连字符，不再用 ${productName}（productName 保持 "DSH Desktop" 作为显示名）。
artifactName: "DSH-Desktop-Setup-${version}.${ext}"
files:
  - "src/**"
  - "build/preload.cjs"
  - "assets/**"
  # 排除归档素材：选字体阶段的候选字体与对照图，不该进安装包
  - "!assets/fonts/_archive/**"
  - "!assets/_archive-*"
  - "!assets/**/_archive/**"
  # 排除截图：README 的文档素材（splash / 主窗口 / 托盘菜单），不该进安装包
  - "!assets/screenshots/**"
  - "package.json"
  - "LICENSE"
afterPack: tools/after-pack.cjs
win:
  target:
    - nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  - provider: github
    owner: "Kk1107k"
    repo: "dsh-desktop"
    releaseType: release
  - provider: generic
    url: "https://dsh-desktop-1432719119.cos.ap-shanghai.myqcloud.com/dsh-desktop"
    channel: cn-stable