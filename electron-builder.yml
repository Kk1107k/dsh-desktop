appId: com.dshdesktop.app
productName: DSH Desktop
directories:
  output: dist
asar: true
compression: maximum
artifactName: "${productName}-Setup-${version}.${ext}"
files:
  - "src/**"
  - "build/preload.cjs"
  - "assets/**"
  # 排除归档素材：选字体阶段的候选字体与对照图，不该进安装包
  - "!assets/fonts/_archive/**"
  - "!assets/_archive-*"
  - "!assets/**/_archive/**"
  # 排除截图：README 的文档素材（splash / 主窗口 / 托盘菜单），不该进安装包
  - "!assets/screenshots/**"
  - "package.json"
  - "LICENSE"
afterPack: tools/after-pack.cjs
win:
  target:
    - nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  - provider: github
    owner: "Kk1107k"
    repo: "dsh-desktop"
    releaseType: release
  - provider: generic
    url: "https://dsh-desktop-1432719119.cos.ap-shanghai.myqcloud.com/dsh-desktop"
    channel: cn-stable